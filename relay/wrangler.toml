name = "poke-relay"
main = "src/index.ts"
compatibility_date = "2026-01-15"
# Request logs are off by default; the relay never logs message content anyway.
workers_dev = true

[[durable_objects.bindings]]
name = "TEAM"
class_name = "Team"

# Free plan requires SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Team"]

[vars]
# Optional: restrict the relay to your team(s). Comma-separated team ids
# (shown in the app under Settings -> Team ID). Empty = any team code works.
ALLOWED_TEAMS = ""
