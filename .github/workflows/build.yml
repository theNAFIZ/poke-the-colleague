name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core tests
        run: cargo test -p poke-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay typecheck
        working-directory: relay
        run: |
          npm ci
          npx wrangler types
          npx tsc --noEmit

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # Oldest supported Ubuntu runner => binaries also run on Debian 12 (glibc 2.36).
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installers
        working-directory: app
        shell: bash
        env:
          # Signs the update files (*.sig). The app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles ${{ matrix.bundles }}
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: building without update signatures"
            npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: poke-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  # Every push to main publishes the installers as GitHub release "v<version>"
  # (version from app/src-tauri/tauri.conf.json) plus latest.json for the in-app
  # updater. Bump the version to roll out an update; pushing again with the same
  # version replaces that release's files (installed apps won't see it as new).
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Give the installers clear names and write latest.json
        id: files
        run: |
          VERSION=$(jq -r .version app/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir out
          find1() { f=$(find dist -name "$1" | head -1); [ -n "$f" ] || { echo "missing $1" >&2; exit 1; }; echo "$f"; }
          WIN="poke-the-colleague_${VERSION}_windows_x64-setup.exe"
          DEB="poke-the-colleague_${VERSION}_amd64.deb"
          APP="poke-the-colleague_${VERSION}_amd64.AppImage"
          cp "$(find1 '*.exe')" "out/$WIN"
          cp "$(find1 '*.deb')" "out/$DEB"
          cp "$(find1 '*.AppImage')" "out/$APP"

          # Manifest read by the in-app updater (releases/latest/download/latest.json).
          if [ -z "$(find dist -name '*.sig' | head -1)" ]; then
            echo "::warning::No update signatures (TAURI_SIGNING_PRIVATE_KEY secret missing): publishing without latest.json"
            ls -l out
            exit 0
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$(git log -1 --pretty=%s)" \
            --arg win_url "$BASE/$WIN" --arg win_sig "$(cat "$(find1 '*.exe.sig')")" \
            --arg deb_url "$BASE/$DEB" --arg deb_sig "$(cat "$(find1 '*.deb.sig')")" \
            --arg app_url "$BASE/$APP" --arg app_sig "$(cat "$(find1 '*.AppImage.sig')")" \
            '{version: $version, pub_date: $date, notes: $notes, platforms: {
                "windows-x86_64-nsis":   {url: $win_url, signature: $win_sig},
                "windows-x86_64":        {url: $win_url, signature: $win_sig},
                "linux-x86_64-deb":      {url: $deb_url, signature: $deb_sig},
                "linux-x86_64-appimage": {url: $app_url, signature: $app_sig},
                "linux-x86_64":          {url: $app_url, signature: $app_sig}
              }}' > out/latest.json
          ls -l out
      - name: Publish release
        run: |
          TAG="v${{ steps.files.outputs.version }}"
          # Point the tag at this commit, so the release always matches its files.
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" out/* --title "Poke the Colleague ${{ steps.files.outputs.version }}" \
              --generate-notes --latest
          fi
