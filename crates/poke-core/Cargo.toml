[package]
name = "poke-core"
description = "Protocol, end-to-end encryption and relay client for Poke the Colleague"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hkdf = "0.13.0"
rand = "0.10.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
